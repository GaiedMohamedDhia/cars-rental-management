apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: cars-rental-frontend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          env:
            # Runtime-only server-side URL. It is never exposed to the browser.
            - name: INTERNAL_API_BASE_URL
              value: "http://backend:8000"

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend

  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 32448

  type: NodePort
