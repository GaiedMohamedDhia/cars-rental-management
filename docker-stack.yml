version: "3.8"

services:
  database:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dhia21
      POSTGRES_DB: cars-rental

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - cars-rental-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cars-rental"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 5
        window: 30s

  backend:
    image: cars-rental-backend:latest

    environment:
      DATABASE_URL: postgresql://postgres:dhia21@database:5432/cars-rental
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set to a random value of at least 32 characters}
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      PYTHONUNBUFFERED: "1"

    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress

    networks:
      - cars-rental-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 5
        window: 30s

  frontend:
    image: cars-rental-frontend:latest

    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://backend:8000

    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress

    networks:
      - cars-rental-network

    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 3s
        max_attempts: 5
        window: 30s

networks:
  cars-rental-network:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
    driver: local
